<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - AI Fitness Plan Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f7;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 750px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .error {
            margin-top: 25px;
            padding: 15px;
            background: #ffe5e5;
            color: #b00020;
            border-radius: 8px;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .result h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💪 FitBuddy</h1>

    <p class="subtitle">
        AI Fitness Plan Generator
    </p>

    <form action="/generate" method="post">

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >

        <label for="age">Age</label>
        <input
            type="number"
            id="age"
            name="age"
            placeholder="Enter your age"
            min="1"
            required
        >

        <label for="weight">Weight (kg)</label>
        <input
            type="number"
            id="weight"
            name="weight"
            placeholder="Enter your weight"
            step="0.1"
            min="1"
            required
        >

        <label for="goal">Fitness Goal</label>
        <select id="goal" name="goal" required>
            <option value="">Select your goal</option>
            <option value="weight loss">Weight Loss</option>
            <option value="muscle gain">Muscle Gain</option>
            <option value="general wellness">General Wellness</option>
            <option value="flexibility">Flexibility</option>
        </select>

        <label for="intensity">Workout Intensity</label>
        <select id="intensity" name="intensity" required>
            <option value="">Select intensity</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <button type="submit">
            Generate Fitness Plan
        </button>

    </form>

    {% if error %}
        <div class="error">
            <strong>Error:</strong><br>
            {{ error }}
        </div>
    {% endif %}

    {% if plan %}
        <div class="result">
            <h2>🏋️ Your 7-Day Fitness Plan</h2>
            {{ plan }}
        </div>
    {% endif %}

</div>

</body>
</html>
